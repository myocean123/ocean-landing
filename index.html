<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XZORE - Connect to What's Next</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        min-height: 100vh;
        background: #0a0f1e;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      body::before {
        content: '';
        position: absolute;
        top: -20%;
        left: -10%;
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(10, 102, 194, 0.15) 0%,
          transparent 65%
        );
        border-radius: 50%;
        animation: pulse 8s ease-in-out infinite;
      }
      body::after {
        content: '';
        position: absolute;
        bottom: -20%;
        right: -10%;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.1) 0%,
          transparent 65%
        );
        border-radius: 50%;
        animation: pulse 8s ease-in-out infinite reverse;
      }
      body.profile-page::before {
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.2) 0%,
          transparent 65%
        );
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        padding: 52px 36px 44px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        position: relative;
        z-index: 1;
        animation: slideUp 0.6s ease-out;
      }
      .logo-wrap {
        margin: 0 auto 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-wrap svg {
        height: 52px;
        width: auto;
      }
      .domain-label {
        color: rgba(255, 255, 255, 0.3);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .tagline {
        color: rgba(255, 255, 255, 0.45);
        font-size: 14px;
        margin-bottom: 36px;
        font-weight: 400;
      }
      .info-badge {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 36px;
        padding: 9px 20px;
        background: rgba(10, 102, 194, 0.15);
        border: 1px solid rgba(10, 102, 194, 0.3);
        border-radius: 50px;
        display: inline-block;
        color: #60a5fa;
        letter-spacing: 0.3px;
      }
      .info-badge.profile {
        background: rgba(99, 102, 241, 0.15);
        border-color: rgba(99, 102, 241, 0.3);
        color: #a5b4fc;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        margin-bottom: 12px;
        border: none;
        cursor: pointer;
        transition: all 0.25s ease;
      }
      .btn-primary {
        background: linear-gradient(135deg, #0a66c2 0%, #1d4ed8 100%);
        color: white;
        box-shadow: 0 0 32px rgba(10, 102, 194, 0.3);
      }
      .btn-primary.profile {
        background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
        box-shadow: 0 0 32px rgba(99, 102, 241, 0.3);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.09);
        transform: translateY(-2px);
      }
      .divider {
        margin: 20px 0 16px;
        color: rgba(255, 255, 255, 0.2);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
      }
      .footer {
        margin-top: 28px;
        color: rgba(255, 255, 255, 0.18);
        font-size: 11px;
        letter-spacing: 0.5px;
      }
      @media (max-width: 480px) {
        .card {
          padding: 40px 24px 36px;
        }
        .logo-wrap svg {
          height: 42px;
        }
        .btn {
          padding: 14px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-wrap">
        <svg
          viewBox="0 0 220 56"
          fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="xgrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#1d4ed8" />
            </linearGradient>
          </defs>
          <!-- Blue gradient X -->
          <line
            x1="6"
            y1="8"
            x2="30"
            y2="48"
            stroke="url(#xgrad)"
            stroke-width="9"
            stroke-linecap="round" />
          <line
            x1="30"
            y1="8"
            x2="6"
            y2="48"
            stroke="url(#xgrad)"
            stroke-width="9"
            stroke-linecap="round" />
          <!-- White ZORE text -->
          <text
            x="44"
            y="44"
            font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
            font-size="42"
            font-weight="800"
            fill="#ffffff"
            letter-spacing="1">
            ZORE
          </text>
        </svg>
      </div>

      <p class="domain-label">XZORE.com</p>
      <p class="tagline">Connect to What's Next</p>

      <p class="info-badge" id="infoBadge">Loading...</p>

      <a id="openAppBtn" class="btn btn-primary" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
          <path
            d="M17 2H7c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-5 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5-3H7V4h10v13z" />
        </svg>
        Open in App
      </a>

      <div class="divider">Don't have the app?</div>

      <a
        class="btn btn-secondary"
        href="https://play.google.com/store/apps/details?id=com.ocean"
        target="_blank">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="rgba(255,255,255,0.65)">
          <path
            d="M3.18 23.76c.34.19.72.24 1.09.14l12.48-7.2-2.76-2.76-10.81 9.82zM.5 1.58C.19 1.97 0 2.54 0 3.26v17.48c0 .72.19 1.29.5 1.68l.09.08 9.79-9.79v-.23L.59 1.5l-.09.08zM20.65 10.23l-2.61-1.51-3.09 3.09 3.09 3.09 2.64-1.53c.75-.43.75-1.13-.03-1.57v-.57zM4.27.1L16.75 7.3 14 10.05 3.18.24C3.54.04 3.93.09 4.27.3z" />
        </svg>
        Download from Play Store
      </a>

      <p class="footer">XZORE &nbsp;·&nbsp; Turn Connections into Careers</p>
    </div>

    <script>
      const path = window.location.pathname;
      const params = new URLSearchParams(window.location.search);
      const APP_SCHEME = 'oceansea';
      const APP_PACKAGE = 'com.ocean';

      let deepLink = APP_SCHEME + '://';
      let intentUrl = '';
      let displayText = 'Browse App';
      let isProfile = false;

      const jobMatch = path.match(/\/job\/([a-zA-Z0-9]+)/);
      if (jobMatch) {
        const jobId = jobMatch[1];
        deepLink = APP_SCHEME + '://job/' + jobId;
        intentUrl =
          'intent://job/' +
          jobId +
          '#Intent;scheme=' +
          APP_SCHEME +
          ';package=' +
          APP_PACKAGE +
          ';end';
        displayText = 'Job #' + jobId;
      }

      const profileMatch = path.match(
        /\/(profile|shared-profile)\/([a-zA-Z0-9-]+)/,
      );
      if (profileMatch) {
        const profileId = profileMatch[2];
        deepLink = APP_SCHEME + '://shared-profile/' + profileId;
        intentUrl =
          'intent://shared-profile/' +
          profileId +
          '#Intent;scheme=' +
          APP_SCHEME +
          ';package=' +
          APP_PACKAGE +
          ';end';
        displayText = 'View Profile';
        isProfile = true;
      }

      const queryId = params.get('id');
      if (queryId && !jobMatch) {
        deepLink = APP_SCHEME + '://shared-profile/' + queryId;
        intentUrl =
          'intent://shared-profile/' +
          queryId +
          '#Intent;scheme=' +
          APP_SCHEME +
          ';package=' +
          APP_PACKAGE +
          ';end';
        displayText = 'View Profile';
        isProfile = true;
      }

      document.getElementById('infoBadge').textContent = displayText;
      const finalUrl = intentUrl || deepLink;
      document.getElementById('openAppBtn').href = finalUrl;

      if (isProfile) {
        document.body.classList.add('profile-page');
        document.getElementById('infoBadge').classList.add('profile');
        document.getElementById('openAppBtn').classList.add('profile');
        document.getElementById('openAppBtn').innerHTML =
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg> View Profile in App';
      }

      if (jobMatch || profileMatch || queryId) {
        setTimeout(function () {
          window.location.href = finalUrl;
        }, 800);
      }
    </script>
  </body>
</html>
